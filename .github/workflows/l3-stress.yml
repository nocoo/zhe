name: L3 Stress Reproduction

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "How many L3 runs to run against the frozen Worker lock"
        required: true
        default: "5"

jobs:
  plan:
    name: "Plan matrix"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: "Build matrix from inputs"
        id: build
        env:
          RUNS: ${{ inputs.runs }}
        run: |
          set -euo pipefail
          if ! [[ "$RUNS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::runs must be a positive integer, got: $RUNS" >&2
            exit 1
          fi
          index_json=$(
            printf '['
            for ((i=1; i<=RUNS; i++)); do
              [ "$i" -gt 1 ] && printf ','
              printf '%d' "$i"
            done
            printf ']'
          )
          matrix="{\"run_index\":${index_json}}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Planned matrix: $matrix"

  matrix:
    name: "L3 stress · locked wrangler · run ${{ matrix.run_index }}"
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: nocoo/base-ci/.github/actions/setup-js@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
        with:
          runtime-version: "1.3.11"
          install-policy: "blocked"

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium webkit

      - name: Install video verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install locked Worker dependencies
        working-directory: worker
        run: |
          bun install --frozen-lockfile --ignore-scripts
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: "Record wrangler version"
        run: |
          mkdir -p artifacts
          wrangler --version | tee artifacts/wrangler-version.txt

      - name: "L3 run ${{ matrix.run_index }}"
        id: l3
        run: bun run test:e2e:pw

      - name: "Record cell outcome"
        if: always()
        run: |
          {
            echo "run_index=${{ matrix.run_index }}"
            echo "wrangler=$(cat artifacts/wrangler-version.txt)"
            echo "conclusion=${{ steps.l3.outcome }}"
          } >> artifacts/outcome.txt

      - name: "Upload wrangler-dev tee log"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stress-tee-run${{ matrix.run_index }}
          path: .test-storage/wrangler-dev.log
          if-no-files-found: error
          retention-days: 14

      - name: "Upload wrangler internal logs"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stress-internal-run${{ matrix.run_index }}
          path: .test-storage/wrangler-internal-logs/
          if-no-files-found: error
          retention-days: 14

      - name: "Upload Playwright report"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stress-report-run${{ matrix.run_index }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: "Upload outcome + version marker"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stress-outcome-run${{ matrix.run_index }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  summarise:
    name: "Stress summary"
    runs-on: ubuntu-latest
    needs: matrix
    if: always()
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: stress-outcome-*
          path: outcomes

      - name: "Aggregate outcomes"
        run: |
          {
            echo "## L3 stress reproduction — outcome distribution"
            echo ""
            echo "| wrangler | run | conclusion |"
            echo "|----------|-----|------------|"
            for f in outcomes/*/outcome.txt; do
              wr=$(grep '^wrangler=' "$f" | cut -d= -f2)
              ri=$(grep '^run_index=' "$f" | cut -d= -f2)
              co=$(grep '^conclusion=' "$f" | cut -d= -f2)
              echo "| $wr | $ri | $co |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
