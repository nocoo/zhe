name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────
  # L1 + G1 + G2 — Core quality gate from base-ci
  # ─────────────────────────────────────────────────────
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ab52d72877d386c9a8fd224e9ac868e88be90539
    with:
      runtime-version: "1.3.11"
      install-policy: "project"
      prepare-command: "bun run build"
      typecheck-command: "bun x tsc --noEmit"
      test-command: "bun run test:unit:coverage && bun run test:integration"
      osv-config: "osv-scanner.toml"
    secrets: inherit

  # ─────────────────────────────────────────────────────
  # L2: API E2E (real HTTP against a fully local stack)
  # Runs in PARALLEL with quality for faster CI.
  # ─────────────────────────────────────────────────────
  api-e2e:
    name: "L2 API E2E (wrangler ${{ matrix.wrangler }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - wrangler: "4.113.0"
            experimental: false
          - wrangler: "4.116.0"
            experimental: true
          - wrangler: "4.118.0"
            experimental: true
    env:
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: "Install wrangler ${{ matrix.wrangler }}"
        run: bun install -g wrangler@${{ matrix.wrangler }} --ignore-scripts

      - name: "Record wrangler version"
        run: |
          mkdir -p artifacts
          wrangler --version | tee artifacts/wrangler-version.txt

      - name: "L2: API E2E tests"
        run: bun run test:api

      - name: "Upload wrangler-dev tee log"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wrangler-dev-log-l2-${{ matrix.wrangler }}
          path: .test-storage/wrangler-dev.log
          if-no-files-found: error
          retention-days: 7

      - name: "Upload wrangler internal logs"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wrangler-internal-logs-l2-${{ matrix.wrangler }}
          path: .test-storage/wrangler-internal-logs/
          if-no-files-found: error
          retention-days: 7

      - name: "Upload wrangler version marker"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wrangler-version-l2-${{ matrix.wrangler }}
          path: artifacts/wrangler-version.txt
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────────────
  # L3: Browser E2E (Playwright against the same local stack)
  # Runs in PARALLEL with quality for faster CI.
  # ─────────────────────────────────────────────────────
  browser-e2e:
    name: "L3 Browser E2E (wrangler ${{ matrix.wrangler }})"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - wrangler: "4.113.0"
            experimental: false
          - wrangler: "4.116.0"
            experimental: true
          - wrangler: "4.118.0"
            experimental: true
    env:
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: "Install wrangler ${{ matrix.wrangler }}"
        run: bun install -g wrangler@${{ matrix.wrangler }} --ignore-scripts

      - name: "Record wrangler version"
        run: |
          mkdir -p artifacts
          wrangler --version | tee artifacts/wrangler-version.txt

      - name: "L3: Playwright E2E tests"
        continue-on-error: ${{ matrix.experimental }}
        run: bun run test:e2e:pw

      - name: "Upload wrangler-dev tee log"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wrangler-dev-log-l3-${{ matrix.wrangler }}
          path: .test-storage/wrangler-dev.log
          if-no-files-found: error
          retention-days: 7

      - name: "Upload wrangler internal logs"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wrangler-internal-logs-l3-${{ matrix.wrangler }}
          path: .test-storage/wrangler-internal-logs/
          if-no-files-found: error
          retention-days: 7

      - name: "Upload wrangler version marker"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wrangler-version-l3-${{ matrix.wrangler }}
          path: artifacts/wrangler-version.txt
          if-no-files-found: error
          retention-days: 7

      - name: "Upload Playwright report"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ matrix.wrangler }}
          path: playwright-report/
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────────────
  # Worker: Edge Worker unit tests
  # Runs in PARALLEL with quality for faster CI.
  # ─────────────────────────────────────────────────────
  worker-tests:
    name: "Worker Tests"
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ab52d72877d386c9a8fd224e9ac868e88be90539
    with:
      runtime-version: "1.3.11"
      install-policy: "project"
      working-directory: "worker"
      timeout-minutes: 10
      command: "bun run test"
