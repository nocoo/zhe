name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────
  # L1 + G1 + G2 — Core quality gate from base-ci
  # ─────────────────────────────────────────────────────
  quality:
    uses: nocoo/base-ci/.github/workflows/bun-quality.yml@aec4adc1a817c56790d1698329ef9398a15a754a  # v2026.5
    with:
      bun-version: "1.3.11"
      pre-command: "bun run build"
      typecheck-command: "bun x tsc --noEmit"
      test-command: "bun run test:unit:coverage && bun run test:integration"
      enable-security: "true"
      osv-config: "osv-scanner.toml"
      # L2/L3/Worker are defined locally for full secret control
      enable-l2: "false"
      enable-l3: "false"
      enable-worker: "false"
    secrets: inherit

  # ─────────────────────────────────────────────────────
  # L2: API E2E (real HTTP against a fully local stack)
  # Runs in PARALLEL with quality for faster CI.
  #
  # No remote Cloudflare resources — scripts/test-stack.ts spins up
  # `wrangler dev --local` (Miniflare D1 + KV) and a local R2 fs shim.
  #
  # Gate on 4.113.0, the last release before the upstream dev-proxy regression
  # documented below in the L3 job. Keep 4.116 and 4.118 as non-blocking probes
  # so the regression evidence remains visible in every run's artifacts.
  # ─────────────────────────────────────────────────────
  api-e2e:
    name: "L2 API E2E (wrangler ${{ matrix.wrangler }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - wrangler: "4.113.0"
            experimental: false
          - wrangler: "4.116.0"
            experimental: true
          - wrangler: "4.118.0"
            experimental: true
    env:
      # Only AUTH_SECRET / WORKER_SECRET remain — everything Cloudflare-shaped
      # is provided by the local Miniflare stack at runtime.
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - run: bun install --frozen-lockfile --ignore-scripts

      # test-stack.ts shells out to `wrangler` for migrations + dev server.
      # Pinned via the matrix so a regression can be attributed to a specific
      # upstream version.
      - name: "Install wrangler ${{ matrix.wrangler }}"
        run: bun install -g wrangler@${{ matrix.wrangler }} --ignore-scripts

      - name: "Record wrangler version"
        run: |
          mkdir -p artifacts
          wrangler --version | tee artifacts/wrangler-version.txt

      - name: "L2: API E2E tests"
        run: bun run test:api

      - name: "Upload wrangler-dev tee log"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-dev-log-l2-${{ matrix.wrangler }}
          path: .test-storage/wrangler-dev.log
          if-no-files-found: error
          retention-days: 7

      - name: "Upload wrangler internal logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-internal-logs-l2-${{ matrix.wrangler }}
          path: .test-storage/wrangler-internal-logs/
          if-no-files-found: error
          retention-days: 7

      - name: "Upload wrangler version marker"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-version-l2-${{ matrix.wrangler }}
          path: artifacts/wrangler-version.txt
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────────────
  # L3: Browser E2E (Playwright against the same local stack)
  # Runs in PARALLEL with quality for faster CI.
  #
  # wrangler 4.114–4.118 contain an upstream Miniflare/workerd regression that
  # intermittently drops the dev-proxy connection under L3 load:
  # https://github.com/cloudflare/workers-sdk/issues/15002
  #
  # Gate on the last known-good release (4.113.0), while retaining 4.116 and
  # 4.118 as non-blocking probes so the regression evidence remains visible.
  # ─────────────────────────────────────────────────────
  browser-e2e:
    name: "L3 Browser E2E (wrangler ${{ matrix.wrangler }})"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - wrangler: "4.113.0"
            experimental: false
          - wrangler: "4.116.0"
            experimental: true
          - wrangler: "4.118.0"
            experimental: true
    env:
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: "Install wrangler ${{ matrix.wrangler }}"
        run: bun install -g wrangler@${{ matrix.wrangler }} --ignore-scripts

      - name: "Record wrangler version"
        run: |
          mkdir -p artifacts
          wrangler --version | tee artifacts/wrangler-version.txt

      - name: "L3: Playwright E2E tests"
        continue-on-error: ${{ matrix.experimental }}
        run: bun run test:e2e:pw

      - name: "Upload wrangler-dev tee log"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-dev-log-l3-${{ matrix.wrangler }}
          path: .test-storage/wrangler-dev.log
          if-no-files-found: error
          retention-days: 7

      - name: "Upload wrangler internal logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-internal-logs-l3-${{ matrix.wrangler }}
          path: .test-storage/wrangler-internal-logs/
          if-no-files-found: error
          retention-days: 7

      - name: "Upload wrangler version marker"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wrangler-version-l3-${{ matrix.wrangler }}
          path: artifacts/wrangler-version.txt
          if-no-files-found: error
          retention-days: 7

      - name: "Upload Playwright report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.wrangler }}
          path: playwright-report/
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────────────
  # Worker: Edge Worker unit tests
  # Runs in PARALLEL with quality for faster CI.
  # ─────────────────────────────────────────────────────
  worker-tests:
    name: "Worker Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: "Worker: Unit tests"
        run: bun run test
