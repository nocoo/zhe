name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    uses: ./.github/workflows/quality-slots.yml
    secrets:
      test-env-json: ${{ secrets.CI_TEST_ENV_JSON }}
