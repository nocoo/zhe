name: Release
"on":
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      ci-run-id:
        description: Successful main push CI run ID for the exact tested commit
        required: true
        type: string
jobs:
  deploy:
    if: |
      github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    uses: nocoo/base-ci/.github/workflows/deploy-docker.yml@af9a2b3f82c367d6eb6def5c3583ac717e0868ad # main 2026-10-26
    with:
      tailscale: true
      environment: zhe / production
      source-run-id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || inputs.ci-run-id }}
      images: '[{"image":"ghcr.io/nocoo/zhe","service":"web"}]'
      deploy-directory: /opt/zhe
      remote-verify-command: |
        python3 - <<'PY'
        import json, os, re, subprocess, time, urllib.error, urllib.request

        source = os.environ['IMAGE_SHA']
        releases = json.loads(os.environ['RELEASE_IMAGES'])
        if not re.fullmatch(r'[a-f0-9]{40}', source) or len(releases) != 1:
            raise SystemExit('Invalid Zhe release manifest')
        release = releases[0]
        if (release.get('service') != 'web' or release.get('image') != 'ghcr.io/nocoo/zhe'
                or release.get('sourceSha') != source
                or not re.fullmatch(r'sha256:[a-f0-9]{64}', release.get('digest', ''))):
            raise SystemExit('Release manifest does not identify the expected Zhe image')

        reference = release['image'] + '@' + release['digest']
        image = json.loads(subprocess.check_output(['docker', 'image', 'inspect', reference], text=True))[0]
        container = json.loads(subprocess.check_output(['docker', 'inspect', 'zhe-app'], text=True))[0]
        if (container['Config']['Image'] != reference or container['Image'] != image['Id']
                or reference not in image.get('RepoDigests', [])
                or image.get('Config', {}).get('Labels', {}).get('org.opencontainers.image.revision') != source):
            raise SystemExit('Running container does not match the verified image digest and source revision')
        version = subprocess.check_output(
            ['docker', 'exec', 'zhe-app', 'node', '-p', "JSON.parse(require('fs').readFileSync('/app/package.json')).version"],
            text=True).strip()
        if not re.fullmatch(r'\d+\.\d+\.\d+', version):
            raise SystemExit('Running image package version is invalid')

        class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, req, fp, code, msg, headers, newurl):
                return None

        opener = urllib.request.build_opener(NoRedirect())

        def request(path, method='GET', body=None, extra_headers=None):
            headers = {
                'User-Agent': 'Uptime-Kuma/2.3.2',
                'Host': 'zhe.to',
                'X-Forwarded-Host': 'zhe.to',
                'X-Forwarded-Proto': 'https',
            }
            if body is not None:
                headers['Content-Type'] = 'application/json'
            headers.update(extra_headers or {})
            req = urllib.request.Request('http://127.0.0.1:17006' + path, data=body, headers=headers, method=method)
            try:
                response = opener.open(req, timeout=10)
                return response.status, response.headers, response.read()
            except urllib.error.HTTPError as error:
                return error.code, error.headers, error.read()

        live = None
        for attempt in range(10):
            try:
                status, headers, payload = request('/api/live')
                if status == 200 and headers.get('Cache-Control') == 'no-store':
                    live = json.loads(payload)
                    break
            except Exception:
                pass
            if attempt < 9:
                time.sleep(3)
        if not live or live.get('status') != 'ok' or live.get('component') != 'zhe' or live.get('database') != {'connected': True} or live.get('version') != version:
            raise SystemExit('Private /api/live did not confirm image version and database health')

        status, headers, body = request('/')
        if status != 200 or 'text/html' not in headers.get('Content-Type', ''):
            raise SystemExit('Private login page check failed')
        assets = set(re.findall(r'(?:src|href)="(/_next/static/[^"?]+\.(?:js|css))"', body.decode()))
        if not all(any(path.endswith(extension) for path in assets) for extension in ('.js', '.css')):
            raise SystemExit('Private login page has no Next JS/CSS asset references')
        for path in assets:
            status, _, payload = request(path)
            if status != 200 or not payload:
                raise SystemExit('Private Next JS/CSS asset check failed')
        status, _, body = request('/api/auth/providers')
        providers = json.loads(body)
        if (status != 200 or 'local-fixture' in providers
                or providers.get('google', {}).get('callbackUrl') != 'https://zhe.to/api/auth/callback/google'):
            raise SystemExit('Private Google provider/canonical callback check failed')
        if request('/github-preview.jpg')[0] != 200:
            raise SystemExit('Private public asset check failed')
        if request('/api/v1/links')[0] != 401 or request('/api/v1/links', 'POST', b'{}')[0] != 401:
            raise SystemExit('Private unauthenticated read/write denial check failed')
        actions = json.loads(subprocess.check_output(
            ['docker', 'exec', 'zhe-app', 'node', '-p',
             "JSON.stringify(require('/app/.next/server/server-reference-manifest.json').node)"], text=True))
        action_ids = [key for key, action in actions.items()
                      if action.get('filename') == 'actions/links.ts' and action.get('exportedName') == 'getLinks'
                      and 'app/(dashboard)/dashboard/page' in action.get('workers', {})]
        if len(action_ids) != 1:
            raise SystemExit('Cannot identify the real read-only dashboard Server Action')
        status, headers, _ = request('/dashboard', 'POST', b'[]', {
            'Origin': 'https://zhe.to', 'Next-Action': action_ids[0],
            'Accept': 'text/x-component', 'Content-Type': 'text/plain;charset=UTF-8',
        })
        if status != 307 or headers.get('Location') not in (
                '/?callbackUrl=%2Fdashboard', 'https://zhe.to/?callbackUrl=%2Fdashboard'):
            raise SystemExit('Private session Proxy did not deny the anonymous Server Action request')
        print(f"Private Zhe acceptance passed: revision {source}, {release['digest']}, version {live['version']}")
        PY
      verify-command: |
        node --input-type=module <<'JS'
        import { verifyDeployment } from './scripts/verify-deployment.mjs';
        try {
          console.log(await verifyDeployment({
            phase: ${{ toJSON(vars.DEPLOY_PHASE) }},
            target: ${{ toJSON(vars.DEPLOY_URL) }},
            originMarker: ${{ toJSON(vars.DEPLOY_ORIGIN_MARKER) }},
            sourceSha: process.env.SOURCE_SHA,
            imageManifest: process.env.RELEASE_IMAGES,
          }));
        } catch (error) {
          console.error(`Deployment verification failed: ${error.message}`);
          process.exitCode = 1;
        }
        JS
      timeout-minutes: 25
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
permissions:
  contents: read
  actions: read
  packages: write
  id-token: write
