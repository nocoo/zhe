# Resource template consumed by scripts/test-stack.ts; launch with bun run dev or test scripts.
name = "zhe-edge-local"
workers_dev = false
preview_urls = false
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "zhe-db-local"
database_id = "00000000-0000-0000-0000-000000000000"

[[kv_namespaces]]
binding = "LINKS_KV"
id = "0000000000000000000000000000000a"

# Worker-side secrets. The matching Bearer tokens are baked into the test
# harness; these values are not used outside `wrangler dev --local`.
[vars]
ORIGIN_URL = "http://127.0.0.1:17006"
WORKER_SECRET = "local-worker-secret"
D1_PROXY_SECRET = "local-d1-proxy-secret"
